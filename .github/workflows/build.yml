
name: Build ORBITAL STRIKE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Extract Cosmic Edition source
        shell: bash
        run: |
          mkdir -p source

          ZIP="ORBITAL-STRIKE-0.3.0-COSMIC-SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Cosmic source ZIP is missing!"
            exit 1
          fi

          unzip -oq "$ZIP" -d source

          PROJECT="$(find source -name settings.gradle -print -quit | xargs dirname)"

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/build.gradle" ]; then
            echo "ERROR: Project folder not found!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Pin Fabric Loom version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT"])
          props = root / "gradle.properties"

          content = props.read_text(encoding="utf-8")
          content, count = re.subn(
              r"(?m)^loom_version=.*$",
              "loom_version=1.19.4",
              content
          )

          if count == 0:
              content += "\nloom_version=1.19.4\n"

          props.write_text(content, encoding="utf-8")
          print("Fabric Loom pinned to 1.19.4")
          PY

      - name: Validate resources and recipes
        run: python3 "$PROJECT/validate_project.py"

      - name: Build ORBITAL STRIKE
        run: |
          gradle -p "$PROJECT" clean build \
            --no-daemon \
            --no-configuration-cache

      - name: Verify generated JAR
        shell: bash
        run: |
          mkdir -p release

          find "$PROJECT/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} release/ \;

          if [ -z "$(find release -name '*.jar' -print -quit)" ]; then
            echo "ERROR: No installable JAR was generated!"
            exit 1
          fi

          echo "Generated JAR:"
          ls -lh release/

      - name: Upload Cosmic Edition
        uses: actions/upload-artifact@v4
        with:
          name: ORBITAL-STRIKE-0.3.0-COSMIC
          path: release/*.jar
          if-no-files-found: error
          retention-days: 14
