
name: Build ORBITAL STRIKE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Validate project resources
        run: python3 validate_project.py

      - name: Build mod JAR
        run: gradle build --no-daemon

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: orbital-strike-0.2.1-alpha
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
