
name: Build ORBITAL STRIKE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Extract project
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -oq "$ZIP" -d source

      - name: Fix Java compatibility and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          roots = list(Path("source").rglob("build.gradle"))
          if not roots:
              raise SystemExit("Could not find build.gradle")

          root = roots[0].parent
          print("Project:", root)

          # Update mod version
          gradle_props = root / "gradle.properties"
          if gradle_props.exists():
              content = gradle_props.read_text(encoding="utf-8")
              content = re.sub(
                  r"(?m)^mod_version=.*$",
                  "mod_version=0.2.1",
                  content
              )
              gradle_props.write_text(content, encoding="utf-8")
              print("Updated gradle.properties")

          # Update Fabric mod metadata
          metadata = root / "src/main/resources/fabric.mod.json"
          if metadata.exists():
              data = json.loads(metadata.read_text(encoding="utf-8"))
              data["version"] = "0.2.1"
              metadata.write_text(
                  json.dumps(data, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("Updated fabric.mod.json")

          replacements = {
              "ParticleTypes.FLASH": "ParticleTypes.EXPLOSION_EMITTER",
              "ParticleTypes.DRAGON_BREATH": "ParticleTypes.CLOUD",
              "addCooldown(this,": "addCooldown(player.getItemInHand(hand),",
              "isOnCooldown(this)": "isOnCooldown(player.getItemInHand(hand))",
              "setSecondsOnFire(1)": "setRemainingFireTicks(20)",
              "setSecondsOnFire(2)": "setRemainingFireTicks(40)",
              "serverLevel.random.nextFloat()": "player.getRandom().nextFloat()",
          }

          count = 0
          for file in root.rglob("*.java"):
              original = file.read_text(encoding="utf-8")
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  count += 1
                  print("Patched:", file)

          print("Patched Java files:", count)
          PY

      - name: Build mod
        run: |
          PROJECT=$(dirname "$(find source -name build.gradle -print -quit)")
          gradle -p "$PROJECT" clean build --no-daemon --no-configuration-cache

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ORBITAL-STRIKE-0.2.1
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
