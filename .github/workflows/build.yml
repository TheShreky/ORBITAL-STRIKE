
name: Build ORBITAL STRIKE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Extract project
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -oq "$ZIP" -d source

      - name: Repair ORBITAL STRIKE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          roots = list(Path("source").rglob("build.gradle"))
          if not roots:
              raise SystemExit("Could not find build.gradle")

          root = roots[0].parent
          print("Project:", root)

          # Update version
          props = root / "gradle.properties"
          content = props.read_text(encoding="utf-8")
          content = re.sub(
              r"(?m)^mod_version=.*$",
              "mod_version=0.2.2",
              content
          )
          props.write_text(content, encoding="utf-8")

          # Fix recipe ingredient format for Minecraft 26.3
          recipe_dir = root / "src/main/resources/data/orbital_strike/recipe"

          if recipe_dir.exists():
              for file in recipe_dir.rglob("*.json"):
                  data = json.loads(file.read_text(encoding="utf-8"))

                  key = data.get("key", {})
                  for symbol, ingredient in key.items():
                      if isinstance(ingredient, dict):
                          if "item" in ingredient:
                              key[symbol] = ingredient["item"]
                          elif "tag" in ingredient:
                              key[symbol] = "#" + ingredient["tag"]

                  data["key"] = key
                  file.write_text(
                      json.dumps(data, indent=2) + "\n",
                      encoding="utf-8"
                  )
                  print("Fixed recipe:", file.name)

          # Fix Minecraft 26.3 Java API compatibility
          replacements = {
              "ParticleTypes.FLASH": "ParticleTypes.EXPLOSION_EMITTER",
              "ParticleTypes.DRAGON_BREATH": "ParticleTypes.CLOUD",
              "addCooldown(this,": "addCooldown(player.getItemInHand(hand),",
              "isOnCooldown(this)": "isOnCooldown(player.getItemInHand(hand))",
              "setSecondsOnFire(1)": "setRemainingFireTicks(20)",
              "setSecondsOnFire(2)": "setRemainingFireTicks(40)",
              "serverLevel.random.nextFloat()": "player.getRandom().nextFloat()",
              '"0.2.0-alpha"': '"0.2.2"',
          }

          for file in root.rglob("*.java"):
              original = file.read_text(encoding="utf-8")
              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  print("Patched Java:", file.name)

          print("Repair completed.")
          PY

      - name: Build mod
        run: |
          PROJECT=$(dirname "$(find source -name build.gradle -print -quit)")
          gradle -p "$PROJECT" clean build --no-daemon --no-configuration-cache

      - name: Prepare release JAR
        run: |
          PROJECT=$(dirname "$(find source -name build.gradle -print -quit)")
          mkdir -p release
          find "$PROJECT/build/libs" -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} release/ \;

          test -n "$(find release -name '*.jar' -print -quit)"

      - name: Upload final mod
        uses: actions/upload-artifact@v4
        with:
          name: ORBITAL-STRIKE-0.2.2
          path: release/*.jar
          if-no-files-found: error
          retention-days: 14
