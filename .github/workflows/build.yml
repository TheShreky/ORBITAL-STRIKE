
name: Build ORBITAL STRIKE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Extract project ZIP
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d source

      - name: Build mod
        run: |
          PROJECT=$(dirname "$(find source -name build.gradle -print -quit)")
          test -n "$PROJECT"
          gradle -p "$PROJECT" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ORBITAL-STRIKE
          path: source/**/build/libs/*.jar
          if-no-files-found: error
