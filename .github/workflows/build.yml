
name: Build ORBITAL STRIKE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP="ORBITAL-STRIKE-0.3.0-COSMIC-SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found in repository root!"
            exit 1
          fi

          mkdir -p source
          unzip -oq "$ZIP" -d source

          PROJECT="$(find source -name settings.gradle -print -quit | xargs dirname)"

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/build.gradle" ]; then
            echo "ERROR: Gradle project not found inside ZIP!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Configure Fabric Loom
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT"])
          props = root / "gradle.properties"

          content = props.read_text(encoding="utf-8")
          content, count = re.subn(
              r"(?m)^loom_version=.*$",
              "loom_version=1.19.4",
              content
          )

          if count == 0:
              content += "\nloom_version=1.19.4\n"

          props.write_text(content, encoding="utf-8")
          print("Fabric Loom configured")
          PY

      - name: Validate project resources
        run: python3 "$PROJECT/validate_project.py"

      - name: Build ORBITAL STRIKE
        run: |
          gradle -p "$PROJECT" clean build \
            --no-daemon \
            --no-configuration-cache

      - name: Prepare JAR
        shell: bash
        run: |
          mkdir -p release

          find "$PROJECT/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} release/ \;

          if [ -z "$(find release -name '*.jar' -print -quit)" ]; then
            echo "ERROR: No installable JAR generated!"
            exit 1
          fi

          ls -lh release/

      - name: Upload ORBITAL STRIKE
        uses: actions/upload-artifact@v4
        with:
          name: ORBITAL-STRIKE-0.3.0-COSMIC
          path: release/*.jar
          if-no-files-found: error
          retention-days: 14
